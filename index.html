<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Divertida Mente</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background: linear-gradient(135deg, #dff4ff, #fff1d6);
            padding: 30px;
        }

        h1 {
            color: #ff6b35;
            font-size: 45px;
        }

        p {
            font-size: 20px;
        }

        .container {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 20px;
        }

        .emocao {
            width: 180px;
            min-height: 230px;
            padding: 15px;
            border-radius: 25px;
            color: white;
            font-size: 23px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

        .emocao:hover {
            transform: scale(1.08);
        }

        .emocao img {
            width: 150px;
            height: 170px;
            object-fit: contain;
            display: block;
            margin: auto;
        }

        #alegria {
            background-color: #ffd21f;
        }

        #tristeza {
            background-color: #3185d6;
        }

        #raiva {
            background-color: #e53935;
        }

        #medo {
            background-color: #7048a8;
        }

        #nojinho {
            background-color: #48a868;
        }

        #mensagem {
            margin-top: 35px;
            font-size: 24px;
            font-weight: bold;
            color: #333;
            min-height: 50px;
        }
    </style>
</head>

<body>

    <h1>🧠 Divertida Mente</h1>

    <p>Clique em uma emoção para descobrir mais!</p>

    <div class="container">

        <!-- ALEGRIA -->
        <div class="emocao" id="alegria"
            onclick="mostrar('Alegria: ela tenta deixar Riley feliz e otimista! 😊')">

            <img src="https://www.pngwing.com/en/free-png-ngkek"
                 alt="Alegria">

            Alegria
        </div>


        <!-- TRISTEZA -->
        <div class="emocao" id="tristeza"
            onclick="mostrar('Tristeza: ela mostra que ficar triste também faz parte da vida. 💙')">

            <img src="https://www.kindpng.com/picc/m/51-511477_sadness-inside-out-png-transparent-png.png"
                 alt="Tristeza">

            Tristeza
        </div>


        <!-- RAIVA -->
        <div class="emocao" id="raiva"
            onclick="mostrar('Raiva: aparece quando algo deixa Riley muito irritada! 😡')">

            <img src="https://www.pngwing.com/en/free-png-ngkek"
                 alt="Raiva">

            Raiva
        </div>


        <!-- MEDO -->
        <div class="emocao" id="medo"
            onclick="mostrar('Medo: tenta proteger Riley de situações perigosas ou assustadoras! 😨')">

            <img src="https://www.pngwing.com/en/free-png-avkqv"
                 alt="Medo">

            Medo
        </div>


        <!-- NOJINHO -->
        <div class="emocao" id="nojinho"
            onclick="mostrar('Nojinho: ajuda Riley a evitar coisas desagradáveis! 🤢')">

            <img src="https://gallery.yopriceville.com/var/resizes/Free-Clipart-Pictures/Cartoons-PNG/Disgust_Inside_Out_Transparent_PNG_Image.png?m=1629830204"
                 alt="Nojinho">

            Nojinho
        </div>

    </div>

    <div id="mensagem"></div>


    <script>
        function mostrar(texto) {
            document.getElementById("mensagem").innerText = texto;
        }
    </script>

</body>
</html>
