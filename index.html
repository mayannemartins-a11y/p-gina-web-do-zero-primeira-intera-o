<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Divertida Mente</title>

    <style>

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            text-align: center;
            background: linear-gradient(135deg, #16005c, #00a6ff);
            color: white;
        }

        h1 {
            font-size: 50px;
            margin-top: 30px;
        }

        p {
            font-size: 21px;
        }

        .container {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 25px;
            margin: 40px;
        }

        .emocao {
            width: 190px;
            min-height: 290px;
            padding: 15px;
            border-radius: 25px;
            color: white;
            font-size: 25px;
            font-weight: bold;
            cursor: pointer;

            box-shadow: 0 8px 20px rgba(0,0,0,0.4);
            transition: 0.3s;
        }

        .emocao:hover {
            transform: scale(1.08);
        }

        .emocao img {
            width: 170px;
            height: 210px;
            object-fit: contain;
            display: block;
            margin: auto;
        }

        #alegria {
            background-color: #FFD21F;
        }

        #tristeza {
            background-color: #3185D6;
        }

        #raiva {
            background-color: #E53935;
        }

        #medo {
            background-color: #7048A8;
        }

        #nojinho {
            background-color: #48A868;
        }

        #mensagem {
            background-color: white;
            color: #222;

            max-width: 700px;
            margin: 20px auto 50px;

            padding: 25px;

            border-radius: 20px;

            font-size: 24px;
            font-weight: bold;

            box-shadow: 0 5px 20px rgba(0,0,0,0.3);
        }

    </style>
</head>


<body>

    <h1>DIVERTIDA MENTE</h1>

    <p>
        Conheça as emoções de Riley!
        <br>
        Clique em um personagem.
    </p>


    <div class="container">

        <!-- ALEGRIA -->

        <div class="emocao"
             id="alegria"
             onclick="mostrar('Alegria representa a felicidade e tenta manter Riley otimista!')">

            <img src="alegria.png" alt="Personagem Alegria">

            Alegria

        </div>


        <!-- TRISTEZA -->

        <div class="emocao"
             id="tristeza"
             onclick="mostrar('Tristeza mostra que ficar triste também faz parte da vida.')">

            <img src="tristeza.png" alt="Personagem Tristeza">

            Tristeza

        </div>


        <!-- RAIVA -->

        <div class="emocao"
             id="raiva"
             onclick="mostrar('Raiva aparece quando Riley fica irritada ou acha algo injusto.')">

            <img src="raiva.png" alt="Personagem Raiva">

            Raiva

        </div>


        <!-- MEDO -->

        <div class="emocao"
             id="medo"
             onclick="mostrar('Medo tenta proteger Riley de situações perigosas.')">

            <img src="medo.png" alt="Personagem Medo">

            Medo

        </div>


        <!-- NOJINHO -->

        <div class="emocao"
             id="nojinho"
             onclick="mostrar('Nojinho ajuda Riley a evitar coisas desagradáveis.')">

            <img src="nojinho.png" alt="Personagem Nojinho">

            Nojinho

        </div>

    </div>


    <div id="mensagem">
        Clique em um personagem para saber mais!
    </div>
