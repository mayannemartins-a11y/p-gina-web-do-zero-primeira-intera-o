<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <title>Divertida Mente</title>

    <style>

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            text-align: center;
            background: linear-gradient(135deg, #16005c, #00a6ff);
            color: white;
        }

        h1 {
            font-size: 50px;
            margin-top: 30px;
        }

        p {
            font-size: 21px;
        }

        .container {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 25px;
            margin: 40px;
        }

        .emocao {
            width: 190px;
            height: 270px;
            border-radius: 25px;
            padding: 15px;
            color: white;
            font-size: 25px;
            font-weight: bold;
            cursor: pointer;

            box-shadow: 0 8px 20px rgba(0,0,0,0.4);
            transition: 0.3s;
        }

        .emocao:hover {
            transform: scale(1.08);
        }

        .personagem {
            width: 170px;
            height: 200px;

            background-image: url("https://cdn.eadplataforma.app/client/eadsinapses/upload/crop/product/photo/011220201606821824image2.jpg-product-photo-detail-mobile.jpg");

            background-size: 850px 850px;
            background-repeat: no-repeat;

            margin: auto;
            border-radius: 20px;
        }

        /* Personagens */

        .alegria-img {
            background-position: -300px -20px;
        }

        .tristeza-img {
            background-position: 20px -20px;
        }

        .raiva-img {
            background-position: -300px -300px;
        }

        .medo-img {
            background-position: -170px -100px;
        }

        .nojinho-img {
            background-position: -570px -100px;
        }


        /* Cores */

        #alegria {
            background-color: #FFD21F;
        }

        #tristeza {
            background-color: #3185D6;
        }

        #raiva {
            background-color: #E53935;
        }

        #medo {
            background-color: #7048A8;
        }

        #nojinho {
            background-color: #48A868;
        }


        #mensagem {
            background-color: white;
            color: #222;

            max-width: 700px;
            margin: 20px auto 50px;

            padding: 25px;

            border-radius: 20px;

            font-size: 24px;
            font-weight: bold;

            box-shadow: 0 5px 20px rgba(0,0,0,0.3);
        }

    </style>
</head>


<body>

    <h1>🧠 DIVERTIDA MENTE</h1>

    <p>
        Conheça as emoções de Riley!
        <br>
        Clique em um personagem.
    </p>


    <div class="container">


        <!-- ALEGRIA -->

        <div class="emocao"
             id="alegria"
             onclick="mostrar('😊 Alegria representa a felicidade e tenta manter Riley otimista!')">

            <div class="personagem alegria-img"></div>

            Alegria

        </div>


        <!-- TRISTEZA -->

        <div class="emocao"
             id="tristeza"
             onclick="mostrar('💙 Tristeza mostra que ficar triste também é importante.')">

            <div class="personagem tristeza-img"></div>

            Tristeza

        </div>


        <!-- RAIVA -->

        <div class="emocao"
             id="raiva"
             onclick="mostrar('😡 Raiva aparece quando Riley fica irritada ou acha algo injusto.')">

            <div class="personagem raiva-img"></div>

            Raiva

        </div>


        <!-- MEDO -->

        <div class="emocao"
             id="medo"
             onclick="mostrar('😨 Medo tenta proteger Riley de situações perigosas.')">

            <div class="personagem medo-img"></div>

            Medo

        </div>


        <!-- NOJINHO -->

        <div class="emocao"
             id="nojinho"
             onclick="mostrar('🤢 Nojinho ajuda Riley a evitar coisas desagradáveis.')">

            <div class="personagem nojinho-img"></div>

            Nojinho

        </div>

    </div>


    <div id="mensagem">
        👆 Clique em uma emoção para saber mais!
    </div>


    <script>

        function mostrar(texto) {

            document.getElementById("mensagem").innerHTML = texto;

        }

    </script>

</body>

</html>
