<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Divertida Mente</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: #e8f4ff;
            padding: 30px;
        }

        h1 {
            color: #ff6b35;
        }

        .emocao {
            display: inline-block;
            width: 150px;
            margin: 10px;
            padding: 20px;
            border-radius: 15px;
            color: white;
            font-size: 20px;
            cursor: pointer;
        }

        #alegria { background-color: #ffd21f; }
        #tristeza { background-color: #3185d6; }
        #raiva { background-color: #e53935; }
        #medo { background-color: #7048a8; }
        #nojinho { background-color: #48a868; }

        #mensagem {
            margin-top: 30px;
            font-size: 22px;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <h1>🧠 Divertida Mente</h1>

    <p>Clique em uma emoção para descobrir uma mensagem!</p>

    <div class="emocao" id="alegria" onclick="mostrar('Alegria: tente sempre encontrar algo bom! 😊')">
        Alegria
    </div>

    <div class="emocao" id="tristeza" onclick="mostrar('Tristeza: tudo bem ficar triste às vezes. 💙')">
        Tristeza
    </div>

    <div class="emocao" id="raiva" onclick="mostrar('Raiva: respire fundo e tente se acalmar! 😡')">
        Raiva
    </div>

    <div class="emocao" id="medo" onclick="mostrar('Medo: ter medo é normal, mas você pode enfrentar seus desafios! 😨')">
        Medo
    </div>

    <div class="emocao" id="nojinho" onclick="mostrar('Nojinho: algumas coisas simplesmente não são agradáveis! 🤢')">
        Nojinho
    </div>

    <div id="mensagem"></div>

    <script>
        function mostrar(texto) {
            document.getElementById("mensagem").innerText = texto;
        }
    </script>

</body>
</html>

}
