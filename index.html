<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Divertida Mente</title>

    <style>

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            text-align: center;
            background: linear-gradient(135deg, #dff6ff, #fff3d6);
        }

        h1 {
            font-size: 45px;
            color: #ff6b35;
            margin-top: 30px;
        }

        p {
            font-size: 20px;
            color: #333;
        }

        .container {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 25px;
            margin-top: 30px;
        }

        .emocao {
            width: 180px;
            height: 250px;
            border-radius: 25px;
            padding: 15px;
            color: white;
            font-size: 24px;
            font-weight: bold;
            cursor: pointer;

            box-shadow: 0 6px 15px rgba(0,0,0,0.2);

            transition: transform 0.3s;
        }

        .emocao:hover {
            transform: scale(1.08);
        }

        .emocao img {
            width: 160px;
            height: 190px;
            object-fit: contain;
        }

        /* Cores das emoções */

        #alegria {
            background-color: #FFD21F;
        }

        #tristeza {
            background-color: #3185D6;
        }

        #raiva {
            background-color: #E53935;
        }

        #medo {
            background-color: #7048A8;
        }

        #nojinho {
            background-color: #48A868;
        }

        #mensagem {
            margin: 40px auto;
            padding: 20px;
            max-width: 700px;

            font-size: 24px;
            font-weight: bold;

            background-color: white;
            border-radius: 20px;

            box-shadow: 0 5px 15px rgba(0,0,0,0.15);
        }

    </style>
</head>

<body>

    <h1>🧠 Divertida Mente</h1>

    <p>
        Conheça as emoções de Riley!
        Clique em um personagem.
    </p>


    <div class="container">

        <!-- ALEGRIA -->

        <div class="emocao"
             id="alegria"
             onclick="mostrar('😊 Alegria: representa a felicidade e tenta deixar Riley feliz!')">

            <img src="alegria.png" alt="Alegria">

            <br>

            Alegria

        </div>


        <!-- TRISTEZA -->

        <div class="emocao"
             id="tristeza"
             onclick="mostrar('💙 Tristeza: mostra que ficar triste também faz parte da vida.')">

            <img src="tristeza.png" alt="Tristeza">

            <br>

            Tristeza

        </div>


        <!-- RAIVA -->

        <div class="emocao"
             id="raiva"
             onclick="mostrar('😡 Raiva: aparece quando Riley fica irritada ou acha que algo é injusto.')">

            <img src="raiva.png" alt="Raiva">

            <br>

            Raiva

        </div>


        <!-- MEDO -->

        <div class="emocao"
             id="medo"
             onclick="mostrar('😨 Medo: tenta proteger Riley de situações perigosas.')">

            <img src="medo.png" alt="Medo">

            <br>

            Medo

        </div>


        <!-- NOJINHO -->

        <div class="emocao"
             id="nojinho"
             onclick="mostrar('🤢 Nojinho: ajuda Riley a evitar coisas desagradáveis.')">

            <img src="nojinho.png" alt="Nojinho">

            <br>

            Nojinho

        </div>

    </div>


    <div id="mensagem">
        Clique em uma emoção! 👆
    </div>


    <script>

        function mostrar(texto) {

            document.getElementById("mensagem").innerHTML = texto;

        }

    </script>

</body>
</html>
